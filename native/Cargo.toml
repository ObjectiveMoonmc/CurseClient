[package]
name = "native"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
reqwest = "0.13.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[lib]
crate-type = ["rlib", "cdylib"]
